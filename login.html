<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IFHE Healthcare – Sign In</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

  <style>
    /* ── Reset & Base ─────────────────────────────────────────── */
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:           #d6e8f5;
      --card-bg:      rgba(255,255,255,0.72);
      --card-border:  rgba(255,255,255,0.9);
      --form-bg:      rgba(178,210,235,0.55);
      --form-border:  rgba(140,185,225,0.6);
      --input-bg:     rgba(255,255,255,0.85);
      --input-border: #a8c8e4;
      --input-focus:  #2563eb;
      --pill-active:  #1e3a5f;
      --pill-text:    #1e3a5f;
      --btn-bg:       #1e3a5f;
      --btn-hover:    #2a4f80;
      --title-color:  #0f1f40;
      --sub-color:    #3a567a;
      --link-color:   #2563eb;
      --shadow-card:  0 24px 60px rgba(30,58,95,0.18), 0 4px 16px rgba(30,58,95,0.10);
      --shadow-btn:   0 4px 18px rgba(30,58,95,0.35);
      --radius-card:  28px;
      --radius-form:  20px;
      --radius-input: 12px;
      --radius-pill:  50px;
      --font:         'Inter', sans-serif;
    }

    body {
      font-family: var(--font);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #c2ddf3 0%, #deeef9 40%, #b5d4ed 100%);
      overflow: hidden;
      position: relative;
    }

    /* Decorative blobs */
    body::before, body::after {
      content: '';
      position: fixed;
      border-radius: 50%;
      filter: blur(80px);
      opacity: 0.35;
      pointer-events: none;
    }
    body::before {
      width: 520px; height: 520px;
      top: -120px; left: -120px;
      background: radial-gradient(circle, #7bb8e8, #3a78b5);
    }
    body::after {
      width: 420px; height: 420px;
      bottom: -100px; right: -100px;
      background: radial-gradient(circle, #a8d4f0, #5fa0d0);
    }

    /* ── Main card ────────────────────────────────────────────── */
    .card {
      position: relative;
      background: var(--card-bg);
      backdrop-filter: blur(24px) saturate(1.6);
      -webkit-backdrop-filter: blur(24px) saturate(1.6);
      border: 1.5px solid var(--card-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);
      width: min(920px, 96vw);
      min-height: 540px;
      display: flex;
      overflow: hidden;
      animation: cardIn 0.7s cubic-bezier(0.22,1,0.36,1) both;
    }

    @keyframes cardIn {
      from { opacity: 0; transform: translateY(32px) scale(0.97); }
      to   { opacity: 1; transform: translateY(0)   scale(1); }
    }

    /* ── Left panel ───────────────────────────────────────────── */
    .left-panel {
      flex: 0 0 52%;
      padding: 44px 48px 44px 48px;
      display: flex;
      flex-direction: column;
      gap: 28px;
      border-right: 1px solid rgba(255,255,255,0.6);
    }

    /* Brand */
    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .brand-icon {
      width: 44px; height: 44px;
      background: linear-gradient(135deg, #1e3a5f, #2563eb);
      border-radius: 12px;
      display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(37,99,235,0.35);
      flex-shrink: 0;
    }
    .brand-icon svg { width: 26px; height: 26px; }
    .brand-name {
      font-size: 1.55rem;
      font-weight: 800;
      color: var(--title-color);
      letter-spacing: -0.4px;
      line-height: 1.1;
    }
    .brand-name span { color: #2563eb; }

    /* Form card */
    .form-card {
      background: var(--form-bg);
      border: 1.5px solid var(--form-border);
      border-radius: var(--radius-form);
      padding: 32px 30px 28px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      flex: 1;
      box-shadow: inset 0 1px 1px rgba(255,255,255,0.6),
                  0 2px 12px rgba(30,58,95,0.08);
    }

    .form-title {
      text-align: center;
      font-size: 1.1rem;
      font-weight: 700;
      color: var(--sub-color);
      letter-spacing: 2px;
      text-transform: uppercase;
    }

    /* Role toggle pill */
    .role-toggle {
      display: flex;
      background: rgba(255,255,255,0.55);
      border: 1.5px solid rgba(140,185,225,0.7);
      border-radius: var(--radius-pill);
      padding: 4px;
      position: relative;
    }
    .role-toggle .slider {
      position: absolute;
      top: 4px; bottom: 4px;
      left: 4px;
      width: calc(50% - 4px);
      background: var(--pill-active);
      border-radius: var(--radius-pill);
      transition: transform 0.28s cubic-bezier(0.34,1.56,0.64,1);
      box-shadow: 0 2px 8px rgba(30,58,95,0.25);
    }
    .role-toggle.volunteer-active .slider {
      transform: translateX(100%);
    }
    .role-btn {
      flex: 1;
      padding: 9px 0;
      border: none;
      background: transparent;
      font-family: var(--font);
      font-size: 0.875rem;
      font-weight: 600;
      cursor: pointer;
      position: relative;
      z-index: 1;
      border-radius: var(--radius-pill);
      transition: color 0.25s;
    }
    .role-btn.active  { color: #fff; }
    .role-btn:not(.active) { color: var(--pill-text); }

    /* Input group */
    .input-group {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }
    .field {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .field label {
      width: 80px;
      font-size: 0.82rem;
      font-weight: 600;
      color: var(--sub-color);
      flex-shrink: 0;
    }
    .field .input-wrap {
      flex: 1;
      position: relative;
    }
    .field input {
      width: 100%;
      padding: 11px 42px 11px 14px;
      background: var(--input-bg);
      border: 1.5px solid var(--input-border);
      border-radius: var(--radius-input);
      font-family: var(--font);
      font-size: 0.88rem;
      color: #1a2a40;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s, transform 0.15s;
    }
    .field input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.15);
      transform: translateY(-1px);
    }
    .field input::placeholder { color: #9ab5cb; }

    .eye-btn {
      position: absolute;
      right: 12px; top: 50%;
      transform: translateY(-50%);
      background: none; border: none;
      cursor: pointer;
      color: #7a9bba;
      font-size: 1rem;
      padding: 0;
      display: flex; align-items: center;
      transition: color 0.2s;
    }
    .eye-btn:hover { color: var(--input-focus); }

    /* Login button */
    .login-btn {
      align-self: center;
      padding: 12px 52px;
      background: linear-gradient(135deg, #1e3a5f 0%, #2a5298 100%);
      color: #fff;
      font-family: var(--font);
      font-size: 0.95rem;
      font-weight: 700;
      border: none;
      border-radius: var(--radius-pill);
      cursor: pointer;
      box-shadow: var(--shadow-btn);
      transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s;
      letter-spacing: 0.5px;
    }
    .login-btn:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(30,58,95,0.42);
    }
    .login-btn:active:not(:disabled) { transform: translateY(0); }
    .login-btn:disabled { opacity: 0.65; cursor: not-allowed; }
    .login-btn.loading { position: relative; color: transparent; }
    .login-btn.loading::after {
      content: '';
      position: absolute;
      width: 18px; height: 18px;
      border: 2.5px solid rgba(255,255,255,0.3);
      border-top-color: #fff;
      border-radius: 50%;
      left: 50%; top: 50%;
      transform: translate(-50%,-50%);
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin { to { transform: translate(-50%,-50%) rotate(360deg); } }

    /* Footer links */
    .form-footer {
      text-align: center;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }
    .form-footer a {
      font-size: 0.78rem;
      font-weight: 500;
      color: var(--link-color);
      text-decoration: none;
      transition: opacity 0.2s, text-decoration 0.2s;
    }
    .form-footer a:hover { text-decoration: underline; opacity: 0.8; }

    /* Error banner */
    .error-banner {
      display: none;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.35);
      border-radius: 10px;
      padding: 9px 14px;
      font-size: 0.8rem;
      color: #b91c1c;
      text-align: center;
      animation: fadeIn 0.3s ease;
    }
    .error-banner.visible { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity:1; transform:none; } }

    /* ── Right panel – SVG illustration ───────────────────────── */
    .right-panel {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .right-panel::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, rgba(37,99,235,0.05) 0%, rgba(30,58,95,0.04) 100%);
    }

    .illustration-wrap {
      width: 100%;
      max-width: 380px;
      position: relative;
      z-index: 1;
      animation: floatAnim 5s ease-in-out infinite;
    }
    @keyframes floatAnim {
      0%,100% { transform: translateY(0px);   }
      50%      { transform: translateY(-10px); }
    }

    /* ── Responsive ───────────────────────────────────────────── */
    @media (max-width: 680px) {
      .card { flex-direction: column; min-height: unset; }
      .left-panel { flex: unset; padding: 32px 24px; border-right: none; border-bottom: 1px solid rgba(255,255,255,0.6); }
      .right-panel { padding: 24px; }
      .illustration-wrap { max-width: 260px; }
    }
  </style>
</head>
<body>

<div class="card" role="main">

  <!-- ── Left: Form ─────────────────────────────────────── -->
  <div class="left-panel">

    <!-- Brand header -->
    <div class="brand">
      <div class="brand-icon">
        <!-- Medical cross SVG icon -->
        <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="10" y="2" width="6" height="22" rx="2" fill="white"/>
          <rect x="2" y="10" width="22" height="6" rx="2" fill="white"/>
        </svg>
      </div>
      <div class="brand-name">IFHE <span>Healthcare</span></div>
    </div>

    <!-- Sign-in form card -->
    <div class="form-card">
      <div class="form-title">Sign In</div>

      <!-- Error banner -->
      <div class="error-banner" id="errorBanner" role="alert"></div>

      <!-- Role toggle -->
      <div class="role-toggle" id="roleToggle">
        <div class="slider" id="toggleSlider"></div>
        <button class="role-btn active" id="btnAdmin"     onclick="selectRole('admin')">Admin</button>
        <button class="role-btn"        id="btnVolunteer" onclick="selectRole('volunteer')">Volunteer</button>
      </div>

      <!-- Credentials -->
      <form id="loginForm" novalidate onsubmit="handleLogin(event)">
        <div class="input-group">
          <div class="field">
            <label for="userId">User ID</label>
            <div class="input-wrap">
              <input
                id="userId"
                type="text"
                placeholder="Enter your user ID"
                autocomplete="username"
                required
              />
            </div>
          </div>
          <div class="field">
            <label for="password">Password</label>
            <div class="input-wrap">
              <input
                id="password"
                type="password"
                placeholder="Enter your password"
                autocomplete="current-password"
                required
              />
              <button type="button" class="eye-btn" id="eyeBtn" onclick="togglePassword()" aria-label="Toggle password visibility">
                <!-- Eye icon (closed by default, visible password) -->
                <svg id="eyeIconShow" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                  <circle cx="12" cy="12" r="3"/>
                </svg>
                <svg id="eyeIconHide" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                  <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"/>
                  <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"/>
                  <line x1="1" y1="1" x2="23" y2="23"/>
                </svg>
              </button>
            </div>
          </div>
        </div>

        <br/>

        <button type="submit" class="login-btn" id="loginBtn">Login</button>
      </form>

      <!-- Footer links -->
      <div class="form-footer">
        <a href="#" onclick="goSignUp(event)">Sign Up?</a>
        <a href="#" onclick="goForgot(event)">Forgot password?</a>
      </div>
    </div>
  </div>

  <!-- ── Right: Illustration ────────────────────────────── -->
  <div class="right-panel" aria-hidden="true">
    <div class="illustration-wrap">
      <!--
        Pure SVG medical illustration – doctor with patient and clipboard.
        Designed to match the Figma reference.
      -->
      <svg viewBox="0 0 380 400" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
        <!-- ── Room / background circle ── -->
        <ellipse cx="190" cy="390" rx="150" ry="18" fill="rgba(30,58,95,0.08)"/>

        <!-- ── Clipboard ── -->
        <rect x="218" y="28" width="130" height="170" rx="10" fill="#2563eb" opacity="0.9"/>
        <rect x="226" y="48" width="114" height="140" rx="7" fill="white" opacity="0.95"/>
        <!-- Clipboard clip -->
        <rect x="264" y="20" width="36" height="22" rx="6" fill="#1e3a5f"/>
        <!-- Medical cross on clipboard -->
        <rect x="270" y="60" width="12" height="42" rx="3" fill="#2563eb"/>
        <rect x="255" y="73" width="42" height="12" rx="3" fill="#2563eb"/>
        <!-- Lines (records) on clipboard -->
        <rect x="235" y="112" width="78" height="7" rx="3" fill="#d0e4f7"/>
        <rect x="235" y="126" width="60" height="7" rx="3" fill="#d0e4f7"/>
        <rect x="235" y="140" width="70" height="7" rx="3" fill="#d0e4f7"/>
        <rect x="235" y="154" width="50" height="7" rx="3" fill="#d0e4f7"/>
        <!-- Clipboard binder ring -->
        <circle cx="276" cy="32" r="10" fill="none" stroke="#1e3a5f" stroke-width="4"/>

        <!-- ── Patient ── -->
        <!-- Patient stool -->
        <rect x="102" y="310" width="6" height="60" rx="3" fill="#94a3b8"/>
        <rect x="136" y="310" width="6" height="60" rx="3" fill="#94a3b8"/>
        <rect x="94"  y="306" width="56" height="10" rx="5" fill="#94a3b8"/>
        <!-- Patient body (yellow top) -->
        <ellipse cx="140" cy="240" rx="28" ry="32" fill="#f59e0b"/>   <!-- torso -->
        <!-- Patient legs (jeans blue) -->
        <rect x="116" y="268" width="22" height="60" rx="10" fill="#1e40af"/>
        <rect x="142" y="268" width="22" height="60" rx="10" fill="#1e40af"/>
        <!-- Patient shoes -->
        <ellipse cx="127" cy="328" rx="12" ry="6" fill="#1e3a5f"/>
        <ellipse cx="153" cy="328" rx="12" ry="6" fill="#1e3a5f"/>
        <!-- Patient arm -->
        <path d="M168 248 Q185 258 180 278" stroke="#f59e0b" stroke-width="14" stroke-linecap="round" fill="none"/>
        <!-- Patient hand -->
        <ellipse cx="180" cy="280" rx="8" ry="7" fill="#d4793a"/>
        <!-- Patient head -->
        <ellipse cx="141" cy="210" rx="24" ry="26" fill="#d4793a"/>
        <!-- Patient hair (black, long) -->
        <path d="M117 200 Q120 160 141 162 Q162 160 165 200 Q155 215 141 220 Q127 215 117 200Z" fill="#1a1a1a"/>
        <path d="M117 200 Q108 230 114 260" stroke="#1a1a1a" stroke-width="10" stroke-linecap="round" fill="none"/>
        <path d="M165 200 Q170 225 162 250" stroke="#1a1a1a" stroke-width="8" stroke-linecap="round" fill="none"/>
        <!-- Patient ear & necklace detail -->
        <circle cx="118" cy="212" r="4" fill="#d4793a"/>

        <!-- ── Doctor ── -->
        <!-- Doctor trousers -->
        <rect x="47" y="270" width="24" height="70" rx="10" fill="#1e40af"/>
        <rect x="75" y="270" width="24" height="70" rx="10" fill="#1e40af"/>
        <!-- Doctor shoes -->
        <ellipse cx="59"  cy="340" rx="14" ry="7" fill="#1e3a5f"/>
        <ellipse cx="87"  cy="340" rx="14" ry="7" fill="#1e3a5f"/>
        <!-- Doctor white coat -->
        <rect x="36" y="178" width="74" height="102" rx="12" fill="white"/>

        <path d="M73 178 L60 195 L73 205Z" fill="#e2e8f0"/>
        <path d="M73 178 L86 195 L73 205Z" fill="#e2e8f0"/>
        <!-- Stethoscope -->
        <path d="M93 200 Q115 215 120 240" stroke="#374151" stroke-width="4" stroke-linecap="round" fill="none"/>

        <circle cx="58" cy="198" r="5" fill="#374151"/>

        <path d="M110 210 Q135 235 125 265" stroke="white" stroke-width="16" stroke-linecap="round" fill="none"/>

        <!-- Doctor hands -->
        <ellipse cx="125" cy="267" rx="9" ry="8" fill="#d4793a"/>
        <ellipse cx="30"  cy="272" rx="8" ry="7" fill="#d4793a"/>
        <!-- Blue tie detail -->
        <rect x="69" y="190" width="8" height="36" rx="4" fill="#2563eb"/>
        <!-- Doctor head (skin) -->
        <ellipse cx="73" cy="158" rx="22" ry="24" fill="#d4793a"/>

        <path d="M51 148 Q54 125 73 124 Q92 125 95 148 Q88 140 73 138 Q58 140 51 148Z" fill="#2d1b00"/>
        <!-- Ears -->
        <circle cx="51" cy="158" r="4" fill="#d4793a"/>
        <circle cx="95" cy="158" r="4" fill="#d4793a"/>

        <rect x="68" y="178" width="10" height="16" rx="4" fill="#d4793a"/>

        <rect x="326" y="340" width="24" height="30" rx="4" fill="#1e40af" opacity="0.7"/>

        <path d="M338 340 Q320 300 340 290 Q340 310 338 340Z" fill="#22c55e"/>

          fill="none"
          stroke="#2563eb"
          stroke-width="2.5"

          stroke-linejoin="round"

    </div>
  </div>

</div><!-- /card -->

<script>
  /* ── State ───────────────────────────────────────────────── */
  let currentRole = 'admin'; // 'admin' | 'volunteer'
  let passwordVisible = false;

  /* ── Role toggle ─────────────────────────────────────────── */
  function selectRole(role) {
    currentRole = role;
    const toggle = document.getElementById('roleToggle');
    const btnAdmin     = document.getElementById('btnAdmin');
    const btnVolunteer = document.getElementById('btnVolunteer');

    if (role === 'admin') {
      toggle.classList.remove('volunteer-active');
      btnAdmin.classList.add('active');
      btnVolunteer.classList.remove('active');
    } else {
      toggle.classList.add('volunteer-active');
      btnAdmin.classList.remove('active');
      btnVolunteer.classList.add('active');
    }

    clearError();
    document.getElementById('userId').value   = '';
    document.getElementById('password').value = '';
    document.getElementById('userId').focus();
  }

  /* ── Password visibility ─────────────────────────────────── */
  function togglePassword() {
    passwordVisible = !passwordVisible;
    const input   = document.getElementById('password');
    const iconShow = document.getElementById('eyeIconShow');
    const iconHide = document.getElementById('eyeIconHide');
    input.type = passwordVisible ? 'text' : 'password';
    iconShow.style.display = passwordVisible ? 'none'  : '';
    iconHide.style.display = passwordVisible ? ''      : 'none';
  }

  /* ── Error helpers ───────────────────────────────────────── */
  function showError(msg) {
    const banner = document.getElementById('errorBanner');
    banner.textContent = msg;
    banner.classList.add('visible');
    setTimeout(() => banner.classList.remove('visible'), 4000);
  }
  function clearError() {
    document.getElementById('errorBanner').classList.remove('visible');
  }

  /* ── Loading state ───────────────────────────────────────── */
  function setLoading(on) {
    const btn = document.getElementById('loginBtn');
    btn.disabled = on;
    btn.classList.toggle('loading', on);
    if (!on) btn.textContent = 'Login';
  }

  /* ── Form submit ─────────────────────────────────────────── */
  async function handleLogin(e) {
    e.preventDefault();
