<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFHE Healthcare - Sign In</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: linear-gradient(135deg, #c2ddf3 0%, #deeef9 42%, #b5d4ed 100%);
            position: relative;
            overflow: hidden;
        }

        body::before,
        body::after {
            content: "";
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            opacity: 0.35;
            pointer-events: none;
        }

        body::before {
            width: 500px;
            height: 500px;
            top: -130px;
            left: -130px;
            background: radial-gradient(circle, #7bb8e8, #3a78b5);
        }

        body::after {
            width: 420px;
            height: 420px;
            right: -100px;
            bottom: -100px;
            background: radial-gradient(circle, #a8d4f0, #5fa0d0);
        }

        .login-shell {
            width: min(920px, 96vw);
            min-height: 540px;
            display: flex;
            overflow: hidden;
            border-radius: 28px;
            background: rgba(255, 255, 255, 0.72);
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(24px) saturate(1.4);
            -webkit-backdrop-filter: blur(24px) saturate(1.4);
            box-shadow: 0 24px 60px rgba(30, 58, 95, 0.18), 0 4px 16px rgba(30, 58, 95, 0.1);
            animation: enter 0.6s ease both;
        }

        @keyframes enter {
            from {
                opacity: 0;
                transform: translateY(24px) scale(0.98);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        .left {
            width: 52%;
            padding: 42px 46px;
            border-right: 1px solid rgba(255, 255, 255, 0.6);
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-badge {
            width: 44px;
            height: 44px;
            border-radius: 12px;
            background: linear-gradient(135deg, #1e3a5f, #2563eb);
            display: flex;
            align-items: center;
            justify-content: center;
            box-shadow: 0 4px 14px rgba(37, 99, 235, 0.32);
            flex-shrink: 0;
        }

        .brand-badge svg {
            width: 26px;
            height: 26px;
        }

        .brand-text {
            font-size: 1.55rem;
            font-weight: 800;
            line-height: 1.1;
            color: #0f1f40;
            letter-spacing: -0.4px;
        }

        .brand-text span {
            color: #2563eb;
        }

        .form-box {
            flex: 1;
            background: rgba(178, 210, 235, 0.55);
            border: 1.5px solid rgba(140, 185, 225, 0.6);
            border-radius: 20px;
            padding: 30px 28px 26px;
            box-shadow: inset 0 1px 1px rgba(255, 255, 255, 0.6), 0 2px 12px rgba(30, 58, 95, 0.08);
            display: flex;
            flex-direction: column;
            gap: 18px;
        }

        .form-box h2 {
            text-align: center;
            font-size: 1.08rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #3a567a;
        }

        .error {
            display: none;
            padding: 10px 14px;
            border-radius: 10px;
            background: rgba(239, 68, 68, 0.12);
            border: 1px solid rgba(239, 68, 68, 0.35);
            color: #b91c1c;
            font-size: 0.82rem;
            text-align: center;
        }

        .error.show {
            display: block;
        }

        .role-switch {
            position: relative;
            display: flex;
            padding: 4px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.55);
            border: 1.5px solid rgba(140, 185, 225, 0.7);
        }

        .switch-pill {
            position: absolute;
            top: 4px;
            left: 4px;
            bottom: 4px;
            width: calc(50% - 4px);
            border-radius: 999px;
            background: #1e3a5f;
            box-shadow: 0 2px 8px rgba(30, 58, 95, 0.25);
            transition: transform 0.25s ease;
        }

        .role-switch.volunteer .switch-pill {
            transform: translateX(100%);
        }

        .role-switch button {
            flex: 1;
            position: relative;
            z-index: 1;
            border: none;
            background: transparent;
            border-radius: 999px;
            padding: 9px 0;
            font: inherit;
            font-size: 0.88rem;
            font-weight: 600;
            cursor: pointer;
            color: #1e3a5f;
            transition: color 0.2s ease;
        }

        .role-switch button.active {
            color: #fff;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .row {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .row label {
            width: 80px;
            font-size: 0.82rem;
            font-weight: 600;
            color: #3a567a;
            flex-shrink: 0;
        }

        .input-area {
            flex: 1;
            position: relative;
        }

        .input-area input {
            width: 100%;
            padding: 11px 42px 11px 14px;
            border-radius: 12px;
            border: 1.5px solid #a8c8e4;
            background: rgba(255, 255, 255, 0.85);
            color: #1a2a40;
            font: inherit;
            font-size: 0.89rem;
            outline: none;
            transition: 0.2s ease;
        }

        .input-area input::placeholder {
            color: #9ab5cb;
        }

        .input-area input:focus {
            border-color: #2563eb;
            box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
            transform: translateY(-1px);
        }

        .toggle-password {
            position: absolute;
            top: 50%;
            right: 12px;
            transform: translateY(-50%);
            border: none;
            background: transparent;
            color: #7a9bba;
            cursor: pointer;
            display: flex;
            align-items: center;
            padding: 0;
        }

        .toggle-password:hover {
            color: #2563eb;
        }

        .submit-wrap {
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }

        .submit-btn {
            min-width: 150px;
            padding: 12px 46px;
            border: none;
            border-radius: 999px;
            background: linear-gradient(135deg, #1e3a5f 0%, #2a5298 100%);
            color: #fff;
            font: inherit;
            font-size: 0.95rem;
            font-weight: 700;
            letter-spacing: 0.4px;
            cursor: pointer;
            box-shadow: 0 4px 18px rgba(30, 58, 95, 0.35);
            transition: 0.2s ease;
        }

        .submit-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(30, 58, 95, 0.42);
        }

        .submit-btn:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .submit-btn.loading {
            color: transparent;
            position: relative;
        }

        .submit-btn.loading::after {
            content: "";
            width: 18px;
            height: 18px;
            border-radius: 50%;
            border: 2.5px solid rgba(255, 255, 255, 0.3);
            border-top-color: #fff;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: translate(-50%, -50%) rotate(360deg);
            }
        }

        .links {
            text-align: center;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .links a {
            color: #2563eb;
            text-decoration: none;
            font-size: 0.78rem;
            font-weight: 500;
        }

        .links a:hover {
            text-decoration: underline;
            opacity: 0.85;
        }

        .right {
            flex: 1;
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .right::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(135deg, rgba(37, 99, 235, 0.05), rgba(30, 58, 95, 0.04));
        }

        .art {
            width: 100%;
            max-width: 380px;
            position: relative;
            z-index: 1;
            animation: floaty 5s ease-in-out infinite;
        }

        @keyframes floaty {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-10px);
            }
        }

        @media (max-width: 680px) {
            .login-shell {
                flex-direction: column;
                min-height: auto;
            }

            .left {
                width: 100%;
                padding: 32px 24px;
                border-right: none;
                border-bottom: 1px solid rgba(255, 255, 255, 0.6);
            }

            .right {
                padding: 24px;
            }

            .art {
                max-width: 260px;
            }
        }
    </style>
</head>

<body>
<div class="login-shell" role="main">
    <div class="left">
        <div class="brand">
            <div class="brand-badge">
                <svg viewBox="0 0 26 26" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <rect x="10" y="2" width="6" height="22" rx="2" fill="white"></rect>
                    <rect x="2" y="10" width="22" height="6" rx="2" fill="white"></rect>
                </svg>
            </div>
            <div class="brand-text">IFHE <span>Healthcare</span></div>
        </div>

        <div class="form-box">
            <h2>Sign In</h2>

            <div class="error" id="errorBox" role="alert"></div>

            <div class="role-switch" id="roleSwitch">
                <div class="switch-pill"></div>
                <button type="button" class="active" id="adminBtn">Admin</button>
                <button type="button" id="volunteerBtn">Volunteer</button>
            </div>

            <form id="loginForm" novalidate>
                <div class="row">
                    <label for="userId">User ID</label>
                    <div class="input-area">
                        <input id="userId" type="text" placeholder="Enter your user ID" autocomplete="username" required />
                    </div>
                </div>

                <div class="row">
                    <label for="password">Password</label>
                    <div class="input-area">
                        <input id="password" type="password" placeholder="Enter your password" autocomplete="current-password" required />
                        <button type="button" class="toggle-password" id="passwordToggle" aria-label="Toggle password visibility">
                            <svg id="eyeOpen" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
                                <circle cx="12" cy="12" r="3"></circle>
                            </svg>
                            <svg id="eyeClosed" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none">
                                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94"></path>
                                <path d="M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19"></path>
                                <line x1="1" y1="1" x2="23" y2="23"></line>
                            </svg>
                        </button>
                    </div>
                </div>

                <div class="submit-wrap">
                    <button type="submit" class="submit-btn" id="loginBtn">Login</button>
                </div>
            </form>

            <div class="links">
                <a href="#" id="signupLink">Sign Up?</a>
                <a href="#" id="forgotLink">Forgot password?</a>
            </div>
        </div>
    </div>

    <div class="right" aria-hidden="true">
        <div class="art">
            <svg viewBox="0 0 380 400" xmlns="http://www.w3.org/2000/svg">
                <ellipse cx="190" cy="390" rx="150" ry="18" fill="rgba(30,58,95,0.08)" />

                <rect x="218" y="28" width="130" height="170" rx="10" fill="#2563eb" opacity="0.9" />
                <rect x="226" y="48" width="114" height="140" rx="7" fill="white" opacity="0.95" />
                <rect x="264" y="20" width="36" height="22" rx="6" fill="#1e3a5f" />

                <rect x="235" y="140" width="70" height="7" rx="3" fill="#d0e4f7" />
                <rect x="235" y="154" width="50" height="7" rx="3" fill="#d0e4f7" />
                <circle cx="276" cy="32" r="10" fill="none" stroke="#1e3a5f" stroke-width="4" />

                <rect x="102" y="310" width="6" height="60" rx="3" fill="#94a3b8" />
                <rect x="136" y="310" width="6" height="60" rx="3" fill="#94a3b8" />

                <ellipse cx="140" cy="240" rx="28" ry="32" fill="#f59e0b" />

                <rect x="142" y="268" width="22" height="60" rx="10" fill="#1e40af" />
                <ellipse cx="127" cy="328" rx="12" ry="6" fill="#1e3a5f" />
                <ellipse cx="153" cy="328" rx="12" ry="6" fill="#1e3a5f" />

            </svg>
        </div>
    </div>
</div>

<script>
    const roleSwitch = document.getElementById("roleSwitch");
    const adminBtn = document.getElementById("adminBtn");
    const volunteerBtn = document.getElementById("volunteerBtn");
    const passwordInput = document.getElementById("password");
    const passwordToggle = document.getElementById("passwordToggle");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");
    const loginForm = document.getElementById("loginForm");
    const loginBtn = document.getElementById("loginBtn");
    const errorBox = document.getElementById("errorBox");
    const signupLink = document.getElementById("signupLink");
    const forgotLink = document.getElementById("forgotLink");

    let currentRole = "admin";

    function setRole(role) {
        currentRole = role;

        if (role === "admin") {
            roleSwitch.classList.remove("volunteer");
            adminBtn.classList.add("active");
            volunteerBtn.classList.remove("active");
        } else {
            roleSwitch.classList.add("volunteer");
            volunteerBtn.classList.add("active");
            adminBtn.classList.remove("active");
        }
    }

    adminBtn.addEventListener("click", () => setRole("admin"));
    volunteerBtn.addEventListener("click", () => setRole("volunteer"));

    passwordToggle.addEventListener("click", () => {
        const hidden = passwordInput.type === "password";
        passwordInput.type = hidden ? "text" : "password";
        eyeOpen.style.display = hidden ? "none" : "block";
        eyeClosed.style.display = hidden ? "block" : "none";
    });

    function showError(message) {
        errorBox.textContent = message;
        errorBox.classList.add("show");
    }

    function clearError() {
        errorBox.textContent = "";
        errorBox.classList.remove("show");
    }

    loginForm.addEventListener("submit", (e) => {
        e.preventDefault();
        clearError();

        const userId = document.getElementById("userId").value.trim();
        const password = passwordInput.value.trim();

        if (!userId || !password) {
            showError("Please enter both user ID and password.");
            return;
        }

        loginBtn.disabled = true;
        loginBtn.classList.add("loading");

        setTimeout(() => {
            loginBtn.disabled = false;
            loginBtn.classList.remove("loading");

            // placeholder login flow
            alert(`Logged in as ${currentRole}: ${userId}`);
        }, 1000);
    });

    signupLink.addEventListener("click", (e) => {
        e.preventDefault();
        alert("Redirect to sign up page");
    });

    forgotLink.addEventListener("click", (e) => {
        e.preventDefault();
        alert("Redirect to forgot password page");
    });
</script>
</body>

</html>
